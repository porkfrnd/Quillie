<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="quillie-title">
  <title id="quillie-title">Quillie</title>
  <defs>
    <!-- Cuts a clean gap in the ring wherever the nib crosses it -->
    <mask id="ring-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path transform="translate(291 291) rotate(-45)" fill="#000" stroke="#000" stroke-width="18" stroke-linejoin="round"
            d="M0 140 C4 118 30 70 32 30 C33.5 18 30 6 20 0 L-20 0 C-30 6 -33.5 18 -32 30 C-30 70 -4 118 0 140 Z"/>
    </mask>
    <!-- Cuts the slit and breather hole out of the nib (nib space, tip pointing down) -->
    <mask id="nib-cut" maskUnits="userSpaceOnUse" x="-60" y="-10" width="120" height="170">
      <rect x="-60" y="-10" width="120" height="170" fill="#fff"/>
      <rect x="-3.5" y="56" width="7" height="100" fill="#000"/>
      <circle cx="0" cy="56" r="10" fill="#000"/>
    </mask>
  </defs>


  <rect width="512" height="512" rx="112" fill="#12141C"/>


  <g transform="translate(256 256) scale(1.12) translate(-248 -247)">
    <circle cx="236" cy="236" r="108" fill="none" stroke="#F5F2EA" stroke-width="48" mask="url(#ring-cut)"/>
    <g transform="translate(291 291) rotate(-45)">
      <path fill="#FFB020" mask="url(#nib-cut)"
            d="M0 140 C4 118 30 70 32 30 C33.5 18 30 6 20 0 L-20 0 C-30 6 -33.5 18 -32 30 C-30 70 -4 118 0 140 Z"/>
    </g>
  </g>
</svg>