[package]
name = "quillie-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Quillie host: commands, filesystem, process supervision, audio."

[lib]
name = "quillie_app"
path = "src/lib.rs"

[[bin]]
name = "quillie"
path = "src/main.rs"
required-features = ["tauri-host"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
quillie-core = { path = "../quillie-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tempfile = "3"

# The Tauri shell is behind the `tauri-host` feature so that filesystem and
# process code still compiles and tests on a machine with no webview
# development packages.
#
# `custom-protocol` is REQUIRED, not optional. Tauri's generate_context! sets
# `dev: cfg!(not(feature = "custom-protocol"))`, so without this feature a
# *release* build loads `build.devUrl` and every packaged binary shows
# "Could not connect to localhost" instead of its own UI. It is enabled for
# both dev and release on purpose: the Tauri CLI passes the custom protocol at
# runtime in dev too.
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }

[dev-dependencies]
quillie-core = { path = "../quillie-core" }

[features]
default = []
# The packaged application. Enabled by the Tauri build.
tauri-host = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-shell", "tauri/custom-protocol"]
# Tests that run the real ffprobe/ffmpeg sidecars against real generated
# media. Off by default so `cargo test` works with no sidecar built.
media = []
# Bundled FFmpeg/ffprobe sidecars are only present in a packaged build.
# `cargo test` on a dev checkout must work without them.
sidecars = []
